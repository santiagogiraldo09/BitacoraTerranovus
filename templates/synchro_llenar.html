<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Llenar formulario — Bitácora IAC</title>
    <link rel="icon" href="{{ url_for('static', filename='logo.png') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='registros.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
    <script>
        (function() {
            const p = "{{ color_primario | default('#FFAF33') }}";
            document.documentElement.style.setProperty('--naranja', p);
        })();
    </script>
    <style>
        .sl-wrap    { max-width: 720px; }
        .sl-volver  { display:inline-flex; align-items:center; gap:6px;
                      font-size:13px; color:#6b7280; text-decoration:none;
                      margin-bottom:10px; }
        .sl-titulo  { font-family:'Sora',sans-serif; font-size:23px;
                      font-weight:700; margin-bottom:4px; }
        .sl-sub     { font-size:13.5px; color:#6b7280; margin-bottom:26px; }

        .sl-campo   { margin-bottom:18px; }
        .sl-label   { display:block; font-size:13px; font-weight:600;
                      color:#374151; margin-bottom:6px; }
        .sl-req     { color:#dc2626; }

        .sl-input, .sl-select, .sl-text {
            width:100%; padding:10px 12px; border:1px solid #e5e7eb;
            border-radius:8px; font-size:14px; font-family:'DM Sans',sans-serif;
            background:#fff; color:#111827;
        }
        .sl-text    { resize:vertical; min-height:92px; }
        .sl-input:focus, .sl-select:focus, .sl-text:focus {
            outline:none; border-color:var(--naranja,#FFAF33);
        }
        .sl-falta   { border-color:#dc2626 !important; background:#fef2f2; }

        .sl-check   { display:flex; align-items:center; gap:9px;
                      font-size:14px; color:#374151; }
        .sl-check input { width:auto; }

        .sl-opciones{ display:flex; flex-direction:column; gap:7px; }

        .sl-nota    { font-size:12px; color:#9ca3af; margin-top:5px;
                      line-height:1.5; }

        .sl-aparte  { background:#f9fafb; border:1px solid #e5e7eb;
                      border-radius:9px; padding:13px 15px; margin-top:26px;
                      font-size:12.5px; color:#6b7280; line-height:1.7; }

        .sl-acciones{ display:flex; gap:10px; margin-top:28px;
                      padding-top:20px; border-top:1px solid #e5e7eb; }
        .sl-btn     { border:none; border-radius:8px; padding:11px 22px;
                      font-family:'DM Sans',sans-serif; font-size:14px;
                      font-weight:600; cursor:pointer;
                      background:var(--naranja,#FFAF33); color:#fff; }
        .sl-btn:disabled { background:#e5e7eb; color:#9ca3af; cursor:not-allowed; }
        .sl-btn-sec { background:#fff; color:#374151; border:1px solid #e5e7eb; }

        .sl-aviso   { font-size:13.5px; margin-top:14px; line-height:1.6; }
        .sl-aviso.error { color:#b91c1c; }
        .sl-aviso.ok    { color:#15803d; }
    </style>
</head>
<body>

<div class="app-layout">

    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="{{ logo_actual or url_for('static', filename='logo_nuevo.png') }}"
                 alt="IAC Logo" class="sidebar-logo-img">
        </div>
        <nav class="sidebar-nav">
            <a href="{{ url_for('registros') }}" class="nav-item">
                <i class="fas fa-folder-open"></i>
                <span>Proyectos</span>
            </a>
            {% if puede('synchro') %}
            <a href="{{ url_for('pantalla_synchro') }}" class="nav-item active">
                <i class="fas fa-cubes"></i>
                <span>Synchro Control</span>
            </a>
            {% endif %}
            {% if session.get('user_rol') == 'admin' %}
            <a href="{{ url_for('configuracion') }}" class="nav-item">
                <i class="fas fa-cog"></i>
                <span>Configuración</span>
            </a>
            <a href="{{ url_for('analitica') }}" class="nav-item">
                <i class="fas fa-chart-bar"></i>
                <span>Dashboard</span>
            </a>
            {% endif %}
        </nav>
        <div class="sidebar-footer">
            <div class="sidebar-user">
                <div class="user-avatar"><i class="fas fa-user"></i></div>
                <div class="user-info">
                    <span class="user-name">{{ session.get('user_name', 'Usuario') }}</span>
                    <span class="user-role">{{ session.get('user_rol', '') }}</span>
                </div>
            </div>
        </div>
    </aside>

    <main class="main-content">

        <div class="mobile-header">
            <img src="{{ logo_actual or url_for('static', filename='logo_nuevo.png') }}"
                 alt="IAC" class="mobile-logo">
            <span class="mobile-title">Formulario</span>
        </div>

        <div class="sl-wrap">
            <a class="sl-volver" href="{{ url_for('pantalla_synchro') }}">
                <i class="fas fa-arrow-left"></i> Synchro Control
            </a>

            <h1 class="sl-titulo" id="sl-nombre">Cargando…</h1>
            <p class="sl-sub" id="sl-proyecto"></p>

            <form id="sl-form" onsubmit="return false;"></form>

            <div id="sl-aparte"></div>

            <div class="sl-acciones" id="sl-acciones" style="display:none;">
                <button class="sl-btn" id="sl-guardar" onclick="guardar()">
                    <i class="fas fa-save"></i> Guardar
                </button>
                <button class="sl-btn sl-btn-sec"
                        onclick="window.location.href='{{ url_for('pantalla_synchro') }}'">
                    Cancelar
                </button>
            </div>

            <p class="sl-aviso" id="sl-aviso"></p>
        </div>

    </main>
</div>

<script>
    const DEFINICION_ID = {{ definicion_id | tojson }};
    let CAMPOS = [];

    function esc(v) {
        return String(v ?? '').replace(/[&<>"']/g, m => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[m]));
    }

    /** Un campo del formulario. 'i' identifica el control en el DOM; el
     *  binding viaja en data-binding porque es la llave real de Synchro. */
    function campoHTML(c, i) {
        const req   = c.requerido ? ' <span class="sl-req">*</span>' : '';
        const label = `<label class="sl-label" for="sl-${i}">${esc(c.etiqueta)}${req}</label>`;
        const attrs = `id="sl-${i}" data-binding="${esc(c.binding)}" data-tipo="${esc(c.tipo)}"`;

        // Los campos de usuarios esperan identificadores de Bentley, no
        // texto libre. Hasta resolver la lista de miembros del proyecto
        // se muestran pero no se dejan llenar.
        if (c.usuarios) {
            return `<div class="sl-campo">${label}
                <input class="sl-input" ${attrs} disabled
                       placeholder="Se asigna desde Synchro">
                <p class="sl-nota">Los responsables todavía se asignan en Synchro.</p>
            </div>`;
        }

        switch (c.tipo) {
            case 'texto_largo':
                return `<div class="sl-campo">${label}
                    <textarea class="sl-text" ${attrs}></textarea></div>`;

            case 'fecha':
                return `<div class="sl-campo">${label}
                    <input type="date" class="sl-input" ${attrs}></div>`;

            case 'numero':
                return `<div class="sl-campo">${label}
                    <input type="number" class="sl-input" ${attrs}></div>`;

            case 'booleano':
                return `<div class="sl-campo">
                    <label class="sl-check">
                        <input type="checkbox" ${attrs}>
                        <span>${esc(c.etiqueta)}</span>
                    </label></div>`;

            case 'seleccion_unica': {
                const ops = (c.opciones || [])
                    .map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join('');
                return `<div class="sl-campo">${label}
                    <select class="sl-select" ${attrs}>
                        <option value="">— Sin seleccionar —</option>${ops}
                    </select></div>`;
            }

            case 'seleccion': {
                // Casillas en vez de un desplegable múltiple: en el
                // teléfono el desplegable múltiple es casi inusable.
                const ops = (c.opciones || []).map((o, j) => `
                    <label class="sl-check">
                        <input type="checkbox" id="sl-${i}-${j}"
                               data-grupo="${i}" value="${esc(o)}">
                        <span>${esc(o)}</span>
                    </label>`).join('');
                return `<div class="sl-campo">${label}
                    <div class="sl-opciones" ${attrs}>${ops || '<span class="sl-nota">Sin opciones</span>'}</div>
                </div>`;
            }

            default:   // texto_corto y cualquier tipo que no conozcamos
                return `<div class="sl-campo">${label}
                    <input type="text" class="sl-input" ${attrs}></div>`;
        }
    }

    async function cargar() {
        try {
            const data = await (await fetch('/api/integraciones/synchro/vinculados')).json();
            const form = (data.formularios || [])
                .find(f => f.definicion_id === DEFINICION_ID);

            if (!form) {
                document.getElementById('sl-nombre').textContent = 'Formulario no disponible';
                document.getElementById('sl-proyecto').textContent =
                    'No está vinculado a tu cuenta. Vuelve a Synchro Control y vincúlalo.';
                return;
            }

            document.getElementById('sl-nombre').textContent   = form.nombre;
            document.getElementById('sl-proyecto').textContent = form.proyecto || '';

            CAMPOS = form.campos || [];
            const enviables    = CAMPOS.filter(c => c.enviable);
            const noEnviables  = CAMPOS.filter(c => !c.enviable);

            document.getElementById('sl-form').innerHTML =
                enviables.map(campoHTML).join('');

            // Se nombran los campos que Synchro gestiona por su cuenta,
            // para que nadie los busque creyendo que faltan.
            if (noEnviables.length) {
                document.getElementById('sl-aparte').innerHTML = `
                    <div class="sl-aparte">
                        <strong>No se llenan desde Bitácora:</strong>
                        ${noEnviables.map(c => esc(c.etiqueta)).join(', ')}.
                        Son campos que Synchro calcula o gestiona por su cuenta.
                    </div>`;
            }

            document.getElementById('sl-acciones').style.display = '';

        } catch {
            document.getElementById('sl-nombre').textContent = 'Error al cargar';
        }
    }

    /** Lo que escribió el usuario, con el binding de Synchro como llave.
     *  Los vacíos no se mandan: un campo en blanco no es un valor. */
    function recoger() {
        const out = {};
        const enviables = CAMPOS.filter(c => c.enviable && !c.usuarios);

        enviables.forEach((c, idxOriginal) => {
            const i  = CAMPOS.filter(x => x.enviable).indexOf(c);
            const el = document.getElementById('sl-' + i);
            if (!el) return;

            if (c.tipo === 'booleano') {
                if (el.checked) out[c.binding] = true;
                return;
            }
            if (c.tipo === 'seleccion') {
                const marcadas = Array.from(
                    document.querySelectorAll(`[data-grupo="${i}"]:checked`)
                ).map(x => x.value);
                if (marcadas.length) out[c.binding] = marcadas;
                return;
            }
            const v = (el.value || '').trim();
            if (v) out[c.binding] = v;
        });

        return out;
    }

    function limpiarMarcas() {
        document.querySelectorAll('.sl-falta')
                .forEach(e => e.classList.remove('sl-falta'));
    }

    async function guardar() {
        const aviso = document.getElementById('sl-aviso');
        const btn   = document.getElementById('sl-guardar');
        limpiarMarcas();
        aviso.textContent = '';
        aviso.className   = 'sl-aviso';

        btn.disabled  = true;
        const antes   = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Guardando…';

        try {
            const res = await fetch('/api/integraciones/synchro/registros', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({
                    definicion_id: DEFINICION_ID,
                    respuestas:    recoger()
                })
            });
            const data = await res.json();

            if (!data.success) {
                aviso.className   = 'sl-aviso error';
                aviso.textContent = data.error || 'No se pudo guardar.';

                // Se resaltan los obligatorios que faltan, en vez de
                // obligar al usuario a buscarlos leyendo el mensaje.
                (data.campos || []).forEach(etiqueta => {
                    const c = CAMPOS.find(x => x.etiqueta === etiqueta);
                    if (!c) return;
                    const i  = CAMPOS.filter(x => x.enviable).indexOf(c);
                    const el = document.getElementById('sl-' + i);
                    if (el) {
                        el.classList.add('sl-falta');
                        el.scrollIntoView({ block: 'center', behavior: 'smooth' });
                    }
                });
                return;
            }

            aviso.className   = 'sl-aviso ok';
            aviso.textContent = 'Guardado en Bitácora. Queda pendiente de enviarse a Synchro.';
            setTimeout(() => window.location.href = '/synchro', 1200);

        } catch {
            aviso.className   = 'sl-aviso error';
            aviso.textContent = 'Error de conexión.';
        } finally {
            btn.disabled  = false;
            btn.innerHTML = antes;
        }
    }

    document.addEventListener('DOMContentLoaded', cargar);
</script>
</body>
</html>
