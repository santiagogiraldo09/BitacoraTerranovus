<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plantilla de informe · Bitácora</title>
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet">

<!--
  Estilos embebidos a propósito: esta pantalla no comparte nada con
  configuracion.css, y así el navegador no puede servir una copia vieja.
-->
<style>
    :root {
        --naranja:       {{ color_primario or '#FBAF33' }};
        --naranja-light: rgba(251,175,51,0.11);
        --borde:  #e5e7eb;
        --fondo:  #f6f7f9;
        --suave:  #9ca3af;
        --texto:  #1f2937;
        --peligro:#dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: 'DM Sans', sans-serif; background: var(--fondo);
        color: var(--texto); height: 100vh; display: flex;
        flex-direction: column; overflow: hidden;
    }

    /* ── Barra superior ───────────────────────────────────────── */
    .pl-header {
        display: flex; align-items: center; gap: 14px; padding: 12px 20px;
        background: #fff; border-bottom: 1px solid var(--borde); flex-shrink: 0;
    }
    .pl-back {
        background: none; border: none; cursor: pointer; font-size: 16px;
        color: var(--suave); padding: 6px 10px; border-radius: 8px;
    }
    .pl-back:hover { background: var(--fondo); }
    .pl-nombre {
        font-size: 16px; font-weight: 700; color: var(--texto);
        border: 1px solid transparent; border-radius: 8px; padding: 6px 10px;
        min-width: 240px; font-family: inherit; background: transparent;
    }
    .pl-nombre:hover { border-color: var(--borde); }
    .pl-nombre:focus { border-color: var(--naranja); outline: none; background: #fff; }
    .pl-acciones { margin-left: auto; display: flex; gap: 10px; align-items: center; }
    .pl-estado { font-size: 12px; color: var(--suave); }
    .pl-estado.sucio { color: var(--naranja); font-weight: 500; }
    .pl-btn {
        display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px;
        border-radius: 9px; border: 1px solid var(--borde); background: #fff;
        color: var(--texto); font-family: inherit; font-size: 13px;
        font-weight: 500; cursor: pointer;
    }
    .pl-btn:hover { background: var(--fondo); }
    .pl-btn.primario { background: var(--naranja); border-color: var(--naranja); color: #fff; }
    .pl-btn.primario:hover { filter: brightness(.94); }

    /* ── Cuerpo ───────────────────────────────────────────────── */
    .pl-cuerpo { display: flex; flex: 1; min-height: 0; }

    .pl-paleta {
        width: 236px; flex-shrink: 0; background: #fff;
        border-right: 1px solid var(--borde); overflow-y: auto; padding: 16px;
    }
    .pl-paleta-titulo {
        font-size: 11px; font-weight: 700; letter-spacing: .5px;
        text-transform: uppercase; color: var(--suave); margin-bottom: 10px;
    }
    .pl-op {
        display: flex; align-items: center; gap: 10px; padding: 10px 12px;
        margin-bottom: 7px; border: 1px solid var(--borde); border-radius: 9px;
        background: #fff; cursor: grab; font-size: 13px;
        transition: border-color .12s, transform .12s;
    }
    .pl-op:hover { border-color: var(--naranja); transform: translateX(2px); }
    .pl-op i { width: 16px; text-align: center; color: var(--suave); }
    .pl-nota {
        font-size: 11.5px; color: var(--suave); line-height: 1.55; margin-top: 16px;
    }

    .pl-lienzo {
        flex: 1; overflow-y: auto; padding: 26px 20px 80px;
        display: flex; flex-direction: column; align-items: center; gap: 26px;
    }
    .pl-zona-nombre {
        font-size: 11px; font-weight: 700; letter-spacing: .5px;
        text-transform: uppercase; color: var(--suave);
        width: 100%; max-width: 720px; margin-bottom: -16px;
    }
    .pl-hoja {
        width: 100%; max-width: 720px; background: #fff;
        border: 1px solid var(--borde); border-radius: 11px;
        box-shadow: 0 1px 3px rgba(0,0,0,.04);
    }
    .pl-hoja.portada { padding: 32px 36px; min-height: 300px; }

    /* ── Franjas ──────────────────────────────────────────────── */
    .pl-franja {
        display: flex; gap: 10px; padding: 12px 20px; align-items: flex-start;
    }
    .pl-franja.sup { border-bottom: 1px solid #f1f2f4; }
    .pl-franja.inf { border-top: 1px solid #f1f2f4; }
    .pl-ranura { flex: 1; min-width: 0; min-height: 34px; }

    .pl-vacia {
        width: 100%; min-height: 34px; border: 1px dashed var(--borde);
        border-radius: 7px; background: #fcfcfd; color: #c3c7cd;
        font-size: 11.5px; cursor: pointer; font-family: inherit;
        display: flex; align-items: center; justify-content: center; gap: 5px;
    }
    .pl-vacia:hover { border-color: var(--naranja); color: var(--naranja); }

    .pl-cuerpo-falso {
        padding: 34px 20px; text-align: center; color: #c3c7cd;
        font-size: 12.5px; line-height: 1.6;
        background: repeating-linear-gradient(135deg, #fcfcfd, #fcfcfd 9px,
                    #f7f8f9 9px, #f7f8f9 18px);
    }

    /* ── Bloques ──────────────────────────────────────────────── */
    .pl-bloque {
        position: relative; border: 1px solid transparent; border-radius: 9px;
        padding: 8px 10px; cursor: pointer;
    }
    .pl-bloque:hover { border-color: var(--borde); }
    .pl-bloque.activo { border-color: var(--naranja); background: var(--naranja-light); cursor: default; }

    .pl-barra { display: none; align-items: center; gap: 5px; margin-bottom: 9px; }
    .pl-bloque.activo .pl-barra { display: flex; }
    .pl-barra-nombre {
        font-size: 10.5px; font-weight: 700; text-transform: uppercase;
        letter-spacing: .4px; color: var(--suave); margin-right: auto;
    }
    .pl-ico {
        background: none; border: none; cursor: pointer; padding: 4px 6px;
        border-radius: 6px; color: var(--suave); font-size: 11.5px;
    }
    .pl-ico:hover { background: #fff; color: var(--texto); }
    .pl-ico.danger:hover { color: var(--peligro); }

    .pl-controles { display: none; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
    .pl-bloque.activo .pl-controles { display: flex; }
    .pl-sel {
        font-family: inherit; font-size: 12px; padding: 5px 8px;
        border: 1px solid var(--borde); border-radius: 7px; background: #fff;
        color: var(--texto); max-width: 100%;
    }
    .pl-tog {
        width: 29px; height: 27px; border: 1px solid var(--borde);
        border-radius: 7px; background: #fff; cursor: pointer;
        font-size: 12px; color: var(--suave);
    }
    .pl-tog.on { background: var(--naranja); border-color: var(--naranja); color: #fff; }

    .pl-texto {
        width: 100%; border: none; background: transparent; font-family: inherit;
        color: inherit; resize: none; outline: none; padding: 0;
        line-height: 1.45; overflow: hidden;
    }
    .pl-texto::placeholder { color: #c7cbd1; }

    .pl-vars { display: none; flex-wrap: wrap; gap: 4px; margin-top: 9px; }
    .pl-bloque.activo .pl-vars { display: flex; }
    .pl-var {
        font-size: 10.5px; padding: 3px 7px; border-radius: 20px;
        border: 1px solid var(--borde); background: #fff; cursor: pointer;
        font-family: inherit; color: var(--suave);
    }
    .pl-var:hover { border-color: var(--naranja); color: var(--texto); }

    .pl-logo { max-height: 42px; max-width: 170px; object-fit: contain; }
    .pl-sep  { border-top: 2px solid var(--borde); }

    /* ── Menú de ranura ───────────────────────────────────────── */
    .pl-menu {
        position: absolute; z-index: 50; background: #fff;
        border: 1px solid var(--borde); border-radius: 9px; padding: 5px;
        box-shadow: 0 6px 20px rgba(0,0,0,.1); min-width: 160px;
    }
    .pl-menu button {
        display: flex; align-items: center; gap: 9px; width: 100%;
        padding: 8px 10px; border: none; background: none; cursor: pointer;
        font-family: inherit; font-size: 13px; color: var(--texto);
        border-radius: 7px; text-align: left;
    }
    .pl-menu button:hover { background: var(--fondo); }
    .pl-menu i { width: 15px; color: var(--suave); }

    .toast {
        position: fixed; bottom: 26px; left: 50%;
        transform: translateX(-50%) translateY(14px); background: #1f2937;
        color: #fff; padding: 12px 22px; border-radius: 10px; font-size: 14px;
        font-weight: 500; opacity: 0; transition: all .3s; z-index: 9999;
        pointer-events: none; max-width: 90%;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 820px) {
        .pl-paleta { width: 180px; padding: 12px; }
        .pl-hoja.portada { padding: 20px; }
    }
</style>
</head>
<body>

<header class="pl-header">
    <button class="pl-back" onclick="salir()" title="Volver">
        <i class="fas fa-chevron-left"></i>
    </button>
    <input type="text" class="pl-nombre" id="pl-nombre"
           placeholder="Nombre de la plantilla" oninput="marcarSucio()">
    <div class="pl-acciones">
        <span class="pl-estado" id="pl-estado">Guardada</span>
        <button class="pl-btn" onclick="restablecer()" title="Volver a la plantilla por defecto">
            <i class="fas fa-rotate-left"></i> Restablecer
        </button>
        <button class="pl-btn primario" onclick="guardar()">
            <i class="fas fa-save"></i> Guardar
        </button>
    </div>
</header>

<div class="pl-cuerpo">

    <aside class="pl-paleta">
        <div class="pl-paleta-titulo">Bloques</div>
        <div id="pl-paleta"></div>
        <p class="pl-nota">
            Arrastra a la portada, o usa el <strong>+</strong> de cada
            ranura del encabezado y el pie.
        </p>
        <p class="pl-nota">
            El encabezado y el pie se repiten desde la página 2: la
            portada queda limpia.
        </p>
    </aside>

    <div class="pl-lienzo">

        <div class="pl-zona-nombre">Portada</div>
        <div class="pl-hoja portada" id="pl-portada"></div>

        <div class="pl-zona-nombre">Páginas interiores</div>
        <div class="pl-hoja">
            <div class="pl-franja sup" id="pl-encabezado"></div>
            <div class="pl-cuerpo-falso">
                El contenido del informe se genera automáticamente<br>
                según lo que se esté reportando.
            </div>
            <div class="pl-franja inf" id="pl-pie"></div>
        </div>

    </div>
</div>

<div class="toast" id="toast"></div>

<script>
const PLANTILLA_ID = {{ plantilla_id or 0 }};
const LOGO_URL     = "{{ logo_actual or url_for('static', filename='logo_nuevo.png') }}";

let CAT   = {bloques: [], estilo: {}, variables: [], ranuras: []};
let P     = null;      // la plantilla
let sel   = null;      // {zona, i} | {zona, ranura}
let sucio = false;

const PX = {titulo_grande: 30, titulo: 22, subtitulo: 16, normal: 13, pequeno: 10.5};
const ESPACIO_PX = {compacto: 2, normal: 10, amplio: 22};
const NOMBRE_TAMANO = {
    titulo_grande: 'Título grande', titulo: 'Título',
    subtitulo: 'Subtítulo', normal: 'Normal', pequeno: 'Pequeño'
};
const CON_TEXTO = ['titulo', 'texto'];

/* ════════════════════════════════════════════════════════════════
   CARGA
   ════════════════════════════════════════════════════════════════ */

async function iniciar() {
    try {
        const r = await fetch('/api/plantillas-informe/catalogo');
        CAT = await r.json();
        if (CAT.error) throw new Error(CAT.error);
    } catch (e) {
        toast('❌ No se pudo cargar el catálogo de bloques');
        return;
    }

    P = clonar(CAT.por_defecto);

    if (PLANTILLA_ID) {
        try {
            const r = await fetch(`/api/plantillas-informe/${PLANTILLA_ID}`);
            const d = await r.json();
            if (d.error) throw new Error(d.error);
            document.getElementById('pl-nombre').value = d.plantilla.nombre || '';
            P = normalizar(d.plantilla.secciones);
        } catch (e) {
            toast('❌ No se pudo cargar la plantilla');
        }
    }

    paleta();
    render();
    limpio();
}

const clonar = o => JSON.parse(JSON.stringify(o));

/** Acepta el formato viejo —una lista plana— metiéndolo en la portada,
 *  para que ninguna plantilla anterior se quede sin abrir. */
function normalizar(s) {
    if (Array.isArray(s)) s = {portada: s};
    s = s || {};
    const franja = f => ({
        izquierda: (f || {}).izquierda || null,
        centro:    (f || {}).centro    || null,
        derecha:   (f || {}).derecha   || null
    });
    return {
        version:    2,
        portada:    Array.isArray(s.portada) ? s.portada : [],
        encabezado: franja(s.encabezado),
        pie:        franja(s.pie)
    };
}

function paleta() {
    const cont = document.getElementById('pl-paleta');
    cont.innerHTML = '';
    (CAT.bloques || []).forEach(b => {
        const d = document.createElement('div');
        d.className = 'pl-op';
        d.draggable = true;
        d.innerHTML = `<i class="fas ${b.icono}"></i><span>${b.nombre}</span>`;
        d.onclick = () => agregarPortada(b.tipo);
        d.ondragstart = e => e.dataTransfer.setData('text/plain', b.tipo);
        cont.appendChild(d);
    });
}

/* ════════════════════════════════════════════════════════════════
   ESTADO
   ════════════════════════════════════════════════════════════════ */

function nuevoBloque(tipo) {
    const e = Object.assign({}, CAT.estilo.por_defecto || {});
    if (tipo === 'titulo') { e.tamano = 'titulo'; e.negrita = true; }
    return {tipo, texto: '', config: {}, estilo: e};
}

function agregarPortada(tipo) {
    if (P.portada.length >= (CAT.max_portada || 12)) {
        toast('La portada ya tiene el máximo de bloques'); return;
    }
    P.portada.push(nuevoBloque(tipo));
    sel = {zona: 'portada', i: P.portada.length - 1};
    marcarSucio(); render();
}

function ponerEnRanura(zona, ranura, tipo) {
    P[zona][ranura] = nuevoBloque(tipo);
    sel = {zona, ranura};
    marcarSucio(); render();
}

function bloqueDe(ref) {
    if (!ref) return null;
    return ref.zona === 'portada' ? P.portada[ref.i] : P[ref.zona][ref.ranura];
}

function quitar(ref) {
    if (ref.zona === 'portada') P.portada.splice(ref.i, 1);
    else P[ref.zona][ref.ranura] = null;
    sel = null; marcarSucio(); render();
}

function mover(i, dir) {
    const j = i + dir;
    if (j < 0 || j >= P.portada.length) return;
    [P.portada[i], P.portada[j]] = [P.portada[j], P.portada[i]];
    sel = {zona: 'portada', i: j};
    marcarSucio(); render();
}

function setEstilo(clave, valor) {
    const b = bloqueDe(sel); if (!b) return;
    b.estilo[clave] = valor;
    marcarSucio(); render();
}

function restablecer() {
    if (!window.confirm('Se reemplaza el diseño actual por la plantilla por defecto. ¿Continuar?')) return;
    P = clonar(CAT.por_defecto);
    sel = null; marcarSucio(); render();
}

/* ════════════════════════════════════════════════════════════════
   RENDER
   ════════════════════════════════════════════════════════════════ */

function render() {
    cerrarMenu();
    renderPortada();
    renderFranja('encabezado', 'pl-encabezado');
    renderFranja('pie', 'pl-pie');
}

function renderPortada() {
    const hoja = document.getElementById('pl-portada');
    hoja.innerHTML = '';

    if (!P.portada.length) {
        hoja.innerHTML = `<p style="text-align:center;color:#c3c7cd;
            font-size:13px;padding:50px 10px;">
            Arrastra bloques aquí, o haz clic en uno de la izquierda.</p>`;
        return;
    }
    P.portada.forEach((b, i) => hoja.appendChild(nodo(b, {zona: 'portada', i})));
}

function renderFranja(zona, destino) {
    const cont = document.getElementById(destino);
    cont.innerHTML = '';

    (CAT.ranuras || ['izquierda', 'centro', 'derecha']).forEach(r => {
        const caja = document.createElement('div');
        caja.className = 'pl-ranura';
        const b = P[zona][r];

        if (b) {
            caja.appendChild(nodo(b, {zona, ranura: r}));
        } else {
            const vacia = document.createElement('button');
            vacia.className = 'pl-vacia';
            vacia.innerHTML = '<i class="fas fa-plus"></i> ' + r;
            vacia.onclick = e => abrirMenu(e, zona, r);
            caja.appendChild(vacia);
        }
        cont.appendChild(caja);
    });
}

function activo(ref) {
    if (!sel || sel.zona !== ref.zona) return false;
    return ref.zona === 'portada' ? sel.i === ref.i : sel.ranura === ref.ranura;
}

function nodo(b, ref) {
    const meta = (CAT.bloques || []).find(x => x.tipo === b.tipo)
              || {nombre: b.tipo, icono: 'fa-cube'};
    const esActivo = activo(ref);

    const div = document.createElement('div');
    div.className = 'pl-bloque' + (esActivo ? ' activo' : '');
    if (ref.zona === 'portada') {
        div.style.marginTop = (ESPACIO_PX[b.estilo.espacio] || 10) + 'px';
    }
    div.onclick = e => {
        if (e.target.closest('.pl-barra, .pl-controles, .pl-vars')) return;
        sel = ref; render();
    };

    div.innerHTML = barra(meta, ref, esActivo)
                  + (esActivo ? controles(b, ref) : '')
                  + cuerpo(b, ref)
                  + (esActivo && CON_TEXTO.includes(b.tipo) ? vars() : '');

    const ta = div.querySelector('.pl-texto');
    if (ta) {
        ta.oninput = () => {
            b.texto = ta.value;
            ta.style.height = 'auto';
            ta.style.height = ta.scrollHeight + 'px';
            marcarSucio();
        };
        requestAnimationFrame(() => {
            ta.style.height = 'auto';
            ta.style.height = ta.scrollHeight + 'px';
        });
    }

    const url = div.querySelector('[data-url]');
    if (url) url.onchange = () => {
        b.config = {url: url.value.trim()};
        marcarSucio(); render();
    };

    return div;
}

function barra(meta, ref, esActivo) {
    if (!esActivo) return '<div class="pl-barra"></div>';
    const flechas = ref.zona === 'portada' ? `
        <button class="pl-ico" onclick="mover(${ref.i},-1)" title="Subir">
            <i class="fas fa-chevron-up"></i></button>
        <button class="pl-ico" onclick="mover(${ref.i},1)" title="Bajar">
            <i class="fas fa-chevron-down"></i></button>` : '';
    return `<div class="pl-barra">
        <span class="pl-barra-nombre">${meta.nombre}</span>
        ${flechas}
        <button class="pl-ico danger" onclick='quitar(${JSON.stringify(ref)})'
                title="Quitar"><i class="fas fa-times"></i></button>
    </div>`;
}

function controles(b, ref) {
    const e = b.estilo;
    const enRanura = ref.zona !== 'portada';
    let h = '<div class="pl-controles">';

    if (b.tipo !== 'separador' && b.tipo !== 'logo' && b.tipo !== 'imagen') {
        h += `<select class="pl-sel" onchange="setEstilo('tamano',this.value)">` +
             (CAT.estilo.tamanos || []).map(t =>
                `<option value="${t}" ${e.tamano === t ? 'selected' : ''}>${NOMBRE_TAMANO[t] || t}</option>`
             ).join('') + '</select>';
        h += `<button class="pl-tog ${e.negrita ? 'on' : ''}"
                 onclick="setEstilo('negrita',${!e.negrita})" title="Negrita"><b>B</b></button>`;
        h += `<button class="pl-tog ${e.cursiva ? 'on' : ''}"
                 onclick="setEstilo('cursiva',${!e.cursiva})" title="Cursiva"><i>I</i></button>`;
        h += `<select class="pl-sel" onchange="setEstilo('color',this.value)">
                <option value="negro" ${e.color==='negro'?'selected':''}>Negro</option>
                <option value="gris"  ${e.color==='gris'?'selected':''}>Gris</option>
                <option value="marca" ${e.color==='marca'?'selected':''}>Color de marca</option>
              </select>`;
    }

    // En una ranura la alineación la define la ranura misma.
    if (!enRanura && b.tipo !== 'separador') {
        h += `<select class="pl-sel" onchange="setEstilo('alineacion',this.value)">
                <option value="izquierda" ${e.alineacion==='izquierda'?'selected':''}>Izquierda</option>
                <option value="centro"    ${e.alineacion==='centro'?'selected':''}>Centro</option>
                <option value="derecha"   ${e.alineacion==='derecha'?'selected':''}>Derecha</option>
              </select>`;
        h += `<select class="pl-sel" onchange="setEstilo('espacio',this.value)">
                <option value="compacto" ${e.espacio==='compacto'?'selected':''}>Espacio compacto</option>
                <option value="normal"   ${e.espacio==='normal'?'selected':''}>Espacio normal</option>
                <option value="amplio"   ${e.espacio==='amplio'?'selected':''}>Espacio amplio</option>
              </select>`;
    }

    return h + '</div>';
}

function estiloCss(e, ref) {
    const color = e.color === 'marca' ? 'var(--naranja)'
                : e.color === 'gris'  ? 'var(--suave)' : 'var(--texto)';
    const ali = ref.zona === 'portada' ? e.alineacion
              : (ref.ranura === 'izquierda' ? 'izquierda'
                 : ref.ranura === 'centro' ? 'centro' : 'derecha');
    return `font-size:${PX[e.tamano] || 13}px;`
         + `text-align:${ali === 'centro' ? 'center' : ali === 'derecha' ? 'right' : 'left'};`
         + `font-weight:${e.negrita ? '700' : '400'};`
         + `font-style:${e.cursiva ? 'italic' : 'normal'};`
         + `color:${color};`;
}

function cuerpo(b, ref) {
    const est = estiloCss(b.estilo, ref);

    if (CON_TEXTO.includes(b.tipo)) {
        const ph = b.tipo === 'titulo' ? 'Escribe el título…'
                 : 'Escribe el texto. Puedes usar {proyecto}, {periodo}…';
        return `<textarea class="pl-texto" rows="1" style="${est}"
                   placeholder="${ph}">${esc(b.texto || '')}</textarea>`;
    }

    if (b.tipo === 'logo') {
        const ali = ref.zona === 'portada' ? b.estilo.alineacion
                  : (ref.ranura === 'centro' ? 'centro'
                     : ref.ranura === 'derecha' ? 'derecha' : 'izquierda');
        return `<div style="text-align:${ali === 'centro' ? 'center'
                   : ali === 'derecha' ? 'right' : 'left'};">
                   <img src="${LOGO_URL}" class="pl-logo" alt="Logo"></div>`;
    }

    if (b.tipo === 'separador') return '<div class="pl-sep"></div>';

    if (b.tipo === 'imagen') {
        const url = (b.config || {}).url || '';
        return `<input type="text" class="pl-sel" data-url
                   style="width:100%;" value="${esc(url)}"
                   placeholder="https://… (URL de la imagen)">
                ${url ? `<img src="${esc(url)}" style="max-width:100%;
                   margin-top:9px;border-radius:7px;">` : ''}`;
    }
    return '';
}

function vars() {
    return '<div class="pl-vars">' + (CAT.variables || []).map(v =>
        `<button class="pl-var" title="${esc(v.descripcion)}"
                 onclick="insertarVar('${v.clave}')">${v.clave}</button>`
    ).join('') + '</div>';
}

function insertarVar(clave) {
    const ta = document.querySelector('.pl-bloque.activo .pl-texto');
    const b  = bloqueDe(sel);
    if (!ta || !b) return;
    const i = ta.selectionStart ?? ta.value.length;
    const f = ta.selectionEnd   ?? ta.value.length;
    ta.value = ta.value.slice(0, i) + clave + ta.value.slice(f);
    b.texto = ta.value;
    ta.focus();
    ta.selectionStart = ta.selectionEnd = i + clave.length;
    marcarSucio();
}

/* ── Menú de las ranuras ────────────────────────────────────── */

function abrirMenu(ev, zona, ranura) {
    ev.stopPropagation();
    cerrarMenu();
    const m = document.createElement('div');
    m.className = 'pl-menu';
    m.id = 'pl-menu';
    m.innerHTML = (CAT.bloques || []).filter(b => b.en_ranura).map(b =>
        `<button onclick="ponerEnRanura('${zona}','${ranura}','${b.tipo}')">
            <i class="fas ${b.icono}"></i> ${b.nombre}</button>`).join('');
    document.body.appendChild(m);
    const r = ev.currentTarget.getBoundingClientRect();
    m.style.left = Math.min(r.left, window.innerWidth - 180) + 'px';
    m.style.top  = (r.bottom + 6) + 'px';
}

function cerrarMenu() {
    document.getElementById('pl-menu')?.remove();
}
document.addEventListener('click', e => {
    if (!e.target.closest('.pl-menu, .pl-vacia')) cerrarMenu();
});

/* ── Arrastrar a la portada ─────────────────────────────────── */
const hojaPortada = document.getElementById('pl-portada');
hojaPortada.addEventListener('dragover', e => e.preventDefault());
hojaPortada.addEventListener('drop', e => {
    e.preventDefault();
    const t = e.dataTransfer.getData('text/plain');
    if (t) agregarPortada(t);
});

/* ════════════════════════════════════════════════════════════════
   GUARDAR
   ════════════════════════════════════════════════════════════════ */

function marcarSucio() {
    sucio = true;
    const el = document.getElementById('pl-estado');
    el.textContent = 'Sin guardar'; el.classList.add('sucio');
}
function limpio() {
    sucio = false;
    const el = document.getElementById('pl-estado');
    el.textContent = 'Guardada'; el.classList.remove('sucio');
}

async function guardar() {
    const nombre = document.getElementById('pl-nombre').value.trim();
    if (!nombre) {
        toast('⚠️ Ponle un nombre a la plantilla');
        document.getElementById('pl-nombre').focus();
        return;
    }
    try {
        const url    = PLANTILLA_ID ? `/api/plantillas-informe/${PLANTILLA_ID}`
                                    : '/api/plantillas-informe';
        const method = PLANTILLA_ID ? 'PUT' : 'POST';
        const res = await fetch(url, {
            method, headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({nombre, secciones: P})
        });
        const d = await res.json();
        if (!d.success) throw new Error(d.error || 'Error');
        limpio();
        toast('✅ Plantilla guardada');
        if (!PLANTILLA_ID && d.id) {
            window.history.replaceState({}, '', `/plantillas-informe/${d.id}`);
        }
    } catch (e) {
        toast('❌ No se pudo guardar');
    }
}

function salir() {
    if (sucio && !window.confirm('Hay cambios sin guardar. ¿Salir de todos modos?')) return;
    window.location.href = '/configuracion#plantillas';
}
window.addEventListener('beforeunload', e => {
    if (!sucio) return;
    e.preventDefault(); e.returnValue = '';
});

/* ── Utilidades ─────────────────────────────────────────────── */
function esc(t) {
    return String(t ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
let tt = null;
function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(tt);
    tt = setTimeout(() => t.classList.remove('show'), 2600);
}

iniciar();
</script>
