<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar acceso — Bitácora</title>
    <link rel="icon" href="{{ url_for('static', filename='logo_nuevo.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
    :root { --naranja:#FFAF33; --naranja-dark:#e59400; --texto:#1a1a1a; --gris:#6b7280; --borde:#e5e7eb; }
    * { box-sizing:border-box; }
    body {
        margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
        padding:24px; background:#f4f4f5; font-family:'DM Sans',system-ui,sans-serif; color:var(--texto);
    }
    .caja { width:100%; max-width:400px; background:#fff; border-radius:16px;
            padding:36px 30px; box-shadow:0 4px 24px rgba(0,0,0,.08); }
    .logo { display:block; height:40px; margin:0 auto 26px; }
    h1 { font-family:'Sora',sans-serif; font-size:21px; margin:0 0 8px; text-align:center; }
    .sub { font-size:14px; line-height:1.6; color:var(--gris); text-align:center; margin:0 0 24px; }
    label { display:block; font-size:12px; font-weight:600; text-transform:uppercase;
            letter-spacing:.5px; color:var(--gris); margin-bottom:6px; }
    input { width:100%; padding:12px 14px; border:1.5px solid var(--borde); border-radius:9px;
            font-size:15px; font-family:inherit; outline:none; transition:border-color .15s; }
    input:focus { border-color:var(--naranja); }
    button { width:100%; margin-top:18px; padding:13px; border:none; border-radius:9px;
             background:var(--naranja); color:#fff; font-size:15px; font-weight:600;
             font-family:inherit; cursor:pointer; transition:background .15s; }
    button:hover:not(:disabled) { background:var(--naranja-dark); }
    button:disabled { opacity:.6; cursor:not-allowed; }
    .volver { display:block; text-align:center; margin-top:20px; font-size:13.5px;
              color:var(--gris); text-decoration:none; }
    .volver:hover { color:var(--naranja-dark); }
    .aviso { display:none; margin-top:18px; padding:14px 16px; border-radius:10px;
             background:#f0fdf4; border:1px solid #bbf7d0; font-size:13.5px;
             line-height:1.6; color:#166534; }
    .error { display:none; margin-top:14px; font-size:13px; color:#dc2626; text-align:center; }
</style>
</head>
<body>
<div class="caja">
    <img src="{{ url_for('static', filename='logo_nuevo.png') }}" alt="Bitácora" class="logo">

    <h1>Recuperar acceso</h1>
    <p class="sub">Escribe tu correo y te enviaremos un enlace para crear una contraseña nueva.</p>

    <form id="form-recuperar" onsubmit="solicitar(event)">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" required autocomplete="email"
               autocapitalize="none" autocorrect="off" spellcheck="false"
               placeholder="correo@empresa.com">
        <button type="submit" id="btn">Enviar enlace</button>
        <p class="error" id="error"></p>
    </form>

    <div class="aviso" id="aviso"></div>

    <a href="/" class="volver">← Volver a iniciar sesión</a>
</div>

<script>
    async function solicitar(e) {
        e.preventDefault();
        const btn   = document.getElementById('btn');
        const error = document.getElementById('error');
        const aviso = document.getElementById('aviso');

        error.style.display = 'none';
        btn.disabled  = true;
        btn.textContent = 'Enviando…';

        try {
            const res  = await fetch('/api/recuperar', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ email: document.getElementById('email').value.trim() })
            });
            const data = await res.json();

            // El formulario se oculta: dejarlo visible invita a reenviar
            // una y otra vez, y el límite de solicitudes es de tres.
            document.getElementById('form-recuperar').style.display = 'none';
            aviso.textContent   = data.mensaje || 'Revisa tu correo.';
            aviso.style.display = 'block';

        } catch {
            error.textContent   = 'No hay conexión. Inténtalo de nuevo.';
            error.style.display = 'block';
            btn.disabled   = false;
            btn.textContent = 'Enviar enlace';
        }
    }
</script>
</body>
</html>
